<!DOCTYPE html>
<!-- Sanitized from a logged-out LinkedIn job page (Easy Apply, fetched 2026-11-14).
     Only the markup the scraper reads is kept; ids, tokens, images and links removed. -->
<html lang="en">
<head><title>Software Engineer - Marketplace | LinkedIn</title></head>
<body>
<main id="main-content">
  <section class="top-card-layout">
    <h1 class="top-card-layout__title">Software Engineer - Marketplace</h1>
    <figcaption class="num-applicants__caption">Be among the first 25 applicants</figcaption>
    <button class="apply-button apply-button--default btn-md btn-primary" data-tracking-control-name="public_jobs_apply-link-onsite" id="topbar-apply">
        Apply
      </button>
    <button class="apply-button apply-button--default top-card-layout__cta top-card-layout__cta--primary btn-md btn-primary" data-tracking-control-name="public_jobs_apply-link-onsite">
        Apply
      </button>
    <button class="top-card-layout__cta top-card-layout__cta--secondary btn-md btn-secondary sign-up-modal__outlet" data-modal="job-details-topcard-save-modal" data-tracking-control-name="public_jobs_topcard-save-job">
        Save
      </button>
  </section>
  <div class="show-more-less-html__markup">
    We are looking for a Software Engineer with Python and Docker experience.
  </div>
  <ul class="description__job-criteria-list">
    <li class="description__job-criteria-item">
      <h3 class="description__job-criteria-subheader">Seniority level</h3>
      <span class="description__job-criteria-text">Mid-Senior level</span>
    </li>
    <li class="description__job-criteria-item">
      <h3 class="description__job-criteria-subheader">Employment type</h3>
      <span class="description__job-criteria-text">Full-time</span>
    </li>
  </ul>
</main>
</body>
</html>
