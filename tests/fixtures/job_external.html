<!DOCTYPE html>
<!-- Sanitized from a logged-out LinkedIn job page (external application, fetched 2026-11-14).
     Only the markup the scraper reads is kept; ids, tokens, images and links removed.
     The logged-out page does not expose the external apply URL: the Apply button only
     opens a sign-in modal. -->
<html lang="en">
<head><title>Developer Sr Analyst - FullStack | LinkedIn</title></head>
<body>
<main id="main-content">
  <section class="top-card-layout">
    <h1 class="top-card-layout__title">Developer Sr Analyst - FullStack</h1>
    <figcaption class="num-applicants__caption">Be among the first 25 applicants</figcaption>
    <button class="top-card-layout__cta top-card-layout__cta--primary btn-md btn-primary" data-modal="job-details-topcard-apply-modal" data-tracking-control-name="public_jobs_contextual-sign-in-modal_ssr-ui-lib-outlet-button">
        Apply
      </button>
    <div class="modal modal--contextual-sign-in" data-outlet="job-details-topcard-apply-modal" id="job-details-topcard-apply-modal">
      <button aria-label="Dismiss" class="modal__dismiss contextual-sign-in-modal__modal-dismiss" data-tracking-control-name="public_jobs_apply-link-offsite_contextual-sign-in-modal_modal_dismiss"></button>
      <h2 class="contextual-sign-in-modal__context-screen-title">Join or sign in to find your next job</h2>
      <a class="contextual-sign-in-modal__join-link" href="https://www.linkedin.com/signup/cold-join" data-tracking-control-name="public_jobs_apply-link-offsite_contextual-sign-in-modal_join-link">Join now</a>
    </div>
  </section>
  <div class="show-more-less-html__markup">
    Fullstack developer position: Java, Angular and SQL.
  </div>
  <ul class="description__job-criteria-list">
    <li class="description__job-criteria-item">
      <h3 class="description__job-criteria-subheader">Seniority level</h3>
      <span class="description__job-criteria-text">Not Applicable</span>
    </li>
    <li class="description__job-criteria-item">
      <h3 class="description__job-criteria-subheader">Employment type</h3>
      <span class="description__job-criteria-text">Full-time</span>
    </li>
  </ul>
</main>
</body>
</html>
